name: sql-lint

on:
  push:
    paths: ["sql/**", ".sqlfluff"]
  pull_request:
    paths: ["sql/**", ".sqlfluff"]

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff==4.5.0
      - run: sqlfluff lint sql/